name: test-video
# Full pipeline WITHOUT uploading to YouTube.
# Produces the video, the thumbnail and the title as downloadable artifacts
# so the owner can approve everything before anything reaches the channel.
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "Video length in minutes"
        required: false
        default: "15"

permissions:
  contents: write

concurrency:
  group: render
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q anthropic google-api-python-client google-auth Pillow piper-tts numpy pydub rembg onnxruntime opencv-python-headless

      - name: Generate script (Claude + web search)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODEL: ${{ vars.MODEL || 'claude-sonnet-4-5' }}
          TARGET_MINUTES: ${{ inputs.minutes || '15' }}
          PRIVACY: "skip"
        run: python3 scripts/generate.py

      - name: Piper fallback voice
        run: |
          mkdir -p assets/voice
          curl -sL https://github.com/rhasspy/piper/releases/download/v0.0.2/voice-en-us-ryan-high.tar.gz | tar xz -C assets/voice/

      - name: TTS
        env:
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
          ELEVEN_API_KEY: ${{ secrets.ELEVEN_API_KEY }}
          ELEVEN_VOICE: ${{ vars.ELEVEN_VOICE || 'alex' }}
          ELEVEN_MODEL: ${{ vars.ELEVEN_MODEL || 'eleven_flash_v2_5' }}
        run: python3 scripts/tts.py content/current/script.json

      - name: Download media libraries
        env:
          GH_TOKEN: ${{ secrets.ADMIN_PAT || github.token }}
          MEDIA_REPO: ${{ vars.MEDIA_REPO || github.repository }}
          OWN_BROLL_SAMPLE: ${{ vars.OWN_BROLL_SAMPLE || '60' }}
          MUSIC_REPO: ${{ vars.MUSIC_REPO || github.repository }}
        run: |
          mkdir -p work/broll work/music work/photos
          # b-roll birden fazla release'e bolunebiliyor: GitHub bir release'e en
          # fazla 1000 dosya kabul ediyor. broll, broll2, broll3... etiketli
          # olanlarin HEPSI indirilir; yeni stok eklemek icin bir sonraki
          # numarayla release acmak yeterli, baska bir sey yapmaya gerek yok.
          # Her etiket kendi alt klasorune iner, ayni adli dosyalar cakismaz
          # (assemble.py work/broll'u alt klasorleriyle birlikte tarar).
          broll_tags=$(gh release list -R "$MEDIA_REPO" --limit 1000 --json tagName -q '.[].tagName' | grep -E '^broll[0-9]*$' || true)
          [ -n "$broll_tags" ] || broll_tags="broll"
          for tag in $broll_tags; do
            mkdir -p "work/broll/$tag"
            gh release download "$tag" -R "$MEDIA_REPO" -D "work/broll/$tag" || echo "no $tag release"
          done
          # NBA Tunnel'in KENDI stok havuzu. Knicks'ten gelen havuza EK olarak
          # kullaniliyor. 250+ klibin hepsini her render'da indirmek diski
          # dolduruyor ve dakikalar yiyor; o yuzden her videoda rastgele bir
          # kismi cekiliyor (varsayilan 60). Her video farkli bir 60 alir.
          # Ayri klasore iniyor ki iki havuzda ayni isimli dosya varsa ezilmesin.
          if [ "$MEDIA_REPO" != "$GITHUB_REPOSITORY" ]; then
            mkdir -p work/broll/own
            # Kendi havuzu da broll, broll2, broll3... diye bolunebilir.
            # Once butun etiketlerin dosya listesi "etiket<TAB>dosya" olarak
            # toplanir, sonra hepsinin icinden rastgele secim yapilir.
            own_tags=$(gh release list -R "$GITHUB_REPOSITORY" --limit 1000 --json tagName -q '.[].tagName' | grep -E '^broll[0-9]*$' || true)
            [ -n "$own_tags" ] || own_tags="broll"
            : > work/own_all.txt
            for t in $own_tags; do
              gh release view "$t" -R "$GITHUB_REPOSITORY" --json assets \
                -q '.assets[].name' 2>/dev/null \
                | sed "s#^#$t\t#" >> work/own_all.txt || true
            done
            shuf -n "${OWN_BROLL_SAMPLE:-60}" work/own_all.txt > work/own_pick.txt || true
            n=0
            while IFS=$'\t' read -r t f; do
              [ -n "$f" ] || continue
              pat=$(printf '%s' "$f" | sed 's/[][*?\\]/\\&/g')
              if gh release download "$t" -R "$GITHUB_REPOSITORY" -p "$pat" \
                   -D work/broll/own --clobber >/dev/null 2>&1; then
                n=$((n+1))
              fi
            done < work/own_pick.txt
            echo "kendi havuzundan $n klip indirildi (toplam $(wc -l < work/own_pick.txt) secildi)"
          fi
          gh release download music -R "$MUSIC_REPO" -D work/music || echo "no music release"
          gh release download photos -R "$MEDIA_REPO" -D work/photos || echo "no photos release"
          python3 scripts/photos.py content/current/script.json || echo "auto photos skipped"

      - name: Visuals
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_IMAGE_QUALITY: ${{ vars.OPENAI_IMAGE_QUALITY || 'high' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
          IMAGE_MODEL: ${{ vars.IMAGE_MODEL }}
        run: python3 scripts/visuals.py content/current/script.json

      - name: Sound effects
        run: python3 scripts/sfx.py

      - name: Assemble
        run: python3 scripts/assemble.py content/current/script.json

      - name: Result summary
        if: always()
        run: |
          echo "## Test video (not uploaded)" >> $GITHUB_STEP_SUMMARY
          python3 -c "import json;m=json.load(open('content/current/meta.json'));print('**Title:** '+m['title'])" >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
          ls -lh work/final.mp4 >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "no video" >> $GITHUB_STEP_SUMMARY

      - name: Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-${{ github.run_number }}
          path: |
            work/final.mp4
            work/thumbnail.jpg
            work/thumbnail_yt.jpg
            content/current/meta.json
            content/current/script.json
          retention-days: 7
          if-no-files-found: ignore
