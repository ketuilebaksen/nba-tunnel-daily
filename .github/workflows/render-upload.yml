name: render-upload
# Manual-script flow: the owner writes the script, drops script.json + meta.json
# into content/current, and this renders the video.
#
# This workflow CANNOT upload to YouTube. The upload step was removed on
# purpose: the owner publishes by hand. The finished video is published as a
# GitHub Release and the owner downloads it from there. Relying on a "privacy"
# field in meta.json was not enough — a stale meta.json once put a video on the
# channel by accident. No step, no accident.
on:
  push:
    paths:
      - "content/current/**"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: render
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q google-api-python-client google-auth Pillow piper-tts numpy pydub rembg onnxruntime opencv-python-headless

      - name: Piper fallback voice
        run: |
          mkdir -p assets/voice
          curl -sL https://github.com/rhasspy/piper/releases/download/v0.0.2/voice-en-us-ryan-high.tar.gz | tar xz -C assets/voice/

      - name: Narration (own recording, else text-to-speech)
        env:
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
          ELEVEN_API_KEY: ${{ secrets.ELEVEN_API_KEY }}
          ELEVEN_MODEL: ${{ vars.ELEVEN_MODEL || 'eleven_flash_v2_5' }}
          WHISPER_MODEL: ${{ vars.WHISPER_MODEL || 'small' }}
          PUNCH_EVERY: ${{ vars.PUNCH_EVERY || '4' }}
        run: |
          # An audio file in content/current means the owner recorded (or
          # generated) the narration themselves. Then we do not synthesise
          # anything — we listen to that file and cut the video to it.
          if ls content/current/*.mp3 content/current/*.wav \
                content/current/*.m4a content/current/*.aac 2>/dev/null | head -1 | grep -q .; then
            echo "audio found -> aligning to the recording"
            pip install -q faster-whisper
            python3 scripts/align.py
          else
            echo "no audio -> synthesising from script.json"
            python3 scripts/tts.py content/current/script.json
          fi

      - name: Download media libraries
        env:
          GH_TOKEN: ${{ secrets.ADMIN_PAT || github.token }}
          MEDIA_REPO: ${{ vars.MEDIA_REPO || github.repository }}
          MUSIC_REPO: ${{ vars.MUSIC_REPO || github.repository }}
        run: |
          mkdir -p work/broll work/music work/photos
          gh release download broll -R "$MEDIA_REPO" -D work/broll || echo "no b-roll release"
          gh release download music -R "$MUSIC_REPO" -D work/music || echo "no music release"
          gh release download photos -R "$MEDIA_REPO" -D work/photos || echo "no photos release"
          python3 scripts/photos.py content/current/script.json || echo "auto photos skipped"

      - name: Visuals
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
        run: python3 scripts/visuals.py content/current/script.json

      - name: Sound effects
        run: python3 scripts/sfx.py

      - name: Assemble
        run: python3 scripts/assemble.py content/current/script.json

      - name: Publish the video for download
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="video-$(date -u +%Y%m%d-%H%M)"
          T=$(python3 -c "import json;print(json.load(open('content/current/meta.json'))['title'][:90])")
          SIZE=$(du -h work/final.mp4 | cut -f1)

          # GitHub tek bir dosyada 2 GB'dan fazlasini kabul etmiyor. Uzun bir
          # video bu siniri asinca bir bucuk saatlik render cope gidiyordu.
          # Simdi buyuk dosya parcalara bolunuyor; parcalar ayni kalitede,
          # yeniden kodlama yok, sadece kesiliyor.
          SIZE_B=$(stat -c%s work/final.mp4)
          TARGET=1600000000
          NOTE=""
          FILES="work/final.mp4"
          if [ "$SIZE_B" -gt "$TARGET" ]; then
            DUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 work/final.mp4)
            PARTS=$(( SIZE_B / TARGET + 1 ))
            SEG=$(python3 -c "print(max(60,int(float('$DUR')/$PARTS)+1))")
            echo "video $SIZE, tek parca yuklenemez -> $PARTS parcaya bolunuyor"
            ffmpeg -y -v error -i work/final.mp4 -c copy -map 0 \
                   -f segment -segment_time "$SEG" -reset_timestamps 1 \
                   "work/bolum_%02d.mp4"
            FILES=$(ls work/bolum_*.mp4 | tr '\n' ' ')
            NOTE=" Video $PARTS parca halinde: bolum_00, bolum_01 ... sirayla indir."
          fi

          gh release create "$TAG" $FILES \
            -R "$GITHUB_REPOSITORY" -t "$T" \
            -n "Hazir video ($SIZE).$NOTE Asagidaki dosyalara tiklayip indir."
          URL="https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
          echo "url=$URL" >> $GITHUB_OUTPUT
          {
            echo "## Video hazir"
            echo ""
            echo "**$T**"
            echo ""
            echo "Indirme sayfasi: $URL"
            echo ""
            echo "Boyut: $SIZE"
          } >> $GITHUB_STEP_SUMMARY

      - name: Bildirim (issue)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/brief.py content/current/script.json \
                                   content/current/meta.json > /dev/null || exit 0
          T=$(python3 -c "import json;print(json.load(open('content/current/meta.json'))['title'][:70])")
          {
            echo ""
            echo "---"
            echo "**Videoyu indir:** ${{ steps.release.outputs.url }}"
          } >> work/kapak_brief.md
          gh issue create -R "$GITHUB_REPOSITORY" \
            --title "VIDEO HAZIR — $T" \
            --body-file work/kapak_brief.md \
            --assignee "${{ github.repository_owner }}" \
          || gh issue create -R "$GITHUB_REPOSITORY" \
            --title "VIDEO HAZIR — $T" \
            --body-file work/kapak_brief.md
