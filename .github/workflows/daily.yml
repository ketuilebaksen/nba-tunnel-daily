name: daily-video
on:
  schedule:
    # Istanbul = UTC+3. Each run starts ~2h before the upload deadline.
    - cron: "0 1 * * *"      # starts 04:00 Istanbul -> uploaded by 06:00 -> publishes 09:00
    - cron: "0 10 * * *"     # starts 13:00 Istanbul -> uploaded by 15:00 -> publishes 21:00
  workflow_dispatch:
    inputs:
      privacy:
        description: "public / private / unlisted"
        required: false
        default: "public"

permissions:
  contents: write
  issues: write

concurrency:
  group: render
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q anthropic google-api-python-client google-auth Pillow piper-tts numpy pydub rembg onnxruntime opencv-python-headless

      - name: Pick today's slot
        run: |
          # morning run   -> publishes 09:00 Istanbul = 06:00 UTC
          # afternoon run -> publishes 21:00 Istanbul = 18:00 UTC
          H=$(date -u +%H)
          if [ "$H" -lt 6 ]; then
            echo "SLOT=early"        >> $GITHUB_ENV
            echo "PUBLISH_UTC=06:00" >> $GITHUB_ENV
          else
            echo "SLOT=late"         >> $GITHUB_ENV
            echo "PUBLISH_UTC=18:00" >> $GITHUB_ENV
          fi

      - name: Generate script (Claude + web search)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODEL: ${{ vars.MODEL || 'claude-sonnet-4-5' }}
          TARGET_MINUTES: ${{ vars.TARGET_MINUTES || '15' }}
          PRIVACY: ${{ inputs.privacy || 'public' }}
        run: |
          echo "slot=$SLOT publish=$PUBLISH_UTC UTC"
          python3 scripts/generate.py

      - name: Commit content
        run: |
          git config user.name "tunnel-bot" && git config user.email "bot@tunnel.auto"
          git add content/ && git commit -m "daily $(date +%F)" || echo "nothing to commit"
          git push || true

      - name: Piper fallback voice
        run: |
          mkdir -p assets/voice
          curl -sL https://github.com/rhasspy/piper/releases/download/v0.0.2/voice-en-us-ryan-high.tar.gz | tar xz -C assets/voice/

      - name: TTS
        env:
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
          ELEVEN_API_KEY: ${{ secrets.ELEVEN_API_KEY }}
          ELEVEN_VOICE: ${{ vars.ELEVEN_VOICE || 'alex' }}
          ELEVEN_MODEL: ${{ vars.ELEVEN_MODEL || 'eleven_flash_v2_5' }}
        run: python3 scripts/tts.py content/current/script.json

      - name: Download media libraries
        env:
          # MEDIA_REPO: borrow b-roll/photos from the other repo.
          # MUSIC_REPO: this channel keeps its OWN music (defaults to this repo).
          GH_TOKEN: ${{ secrets.ADMIN_PAT || github.token }}
          MEDIA_REPO: ${{ vars.MEDIA_REPO || github.repository }}
          MUSIC_REPO: ${{ vars.MUSIC_REPO || github.repository }}
        run: |
          mkdir -p work/broll work/music work/photos
          echo "b-roll source: $MEDIA_REPO | music source: $MUSIC_REPO"
          gh release download broll -R "$MEDIA_REPO" -D work/broll || echo "no b-roll release"
          gh release download music -R "$MUSIC_REPO" -D work/music || echo "no music release"
          gh release download photos -R "$MEDIA_REPO" -D work/photos || echo "no photos release"
          python3 scripts/photos.py content/current/script.json || echo "auto photos skipped"

      - name: Visuals
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_IMAGE_QUALITY: ${{ vars.OPENAI_IMAGE_QUALITY || 'high' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
          IMAGE_MODEL: ${{ vars.IMAGE_MODEL }}
        run: python3 scripts/visuals.py content/current/script.json

      - name: Sound effects
        run: python3 scripts/sfx.py

      - name: Assemble
        run: python3 scripts/assemble.py content/current/script.json

      - name: Upload to YouTube
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          SKIP_THUMBNAIL: ${{ vars.SKIP_THUMBNAIL || '1' }}
        run: python3 scripts/upload.py content/current/meta.json

      - name: Kapak notu (issue + e-posta)
        if: success()        # only when the video really reached YouTube
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/brief.py content/current/script.json \
                                   content/current/meta.json > /dev/null || exit 0
          cat work/kapak_brief.md >> $GITHUB_STEP_SUMMARY
          T=$(python3 -c "import json;print(json.load(open('content/current/meta.json'))['title'][:70])")
          gh issue create -R "$GITHUB_REPOSITORY" \
            --title "KAPAK GEREKLI — $T" \
            --body-file work/kapak_brief.md \
            --assignee "${{ github.repository_owner }}" \
          || gh issue create -R "$GITHUB_REPOSITORY" \
            --title "KAPAK GEREKLI — $T" \
            --body-file work/kapak_brief.md

      - name: Result summary
        if: always()
        run: |
          echo "## Result" >> $GITHUB_STEP_SUMMARY
          cat upload_result.json >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "upload failed — check logs" >> $GITHUB_STEP_SUMMARY

      - name: Keep artifacts (2 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-${{ github.run_number }}
          path: |
            content/current/meta.json
            content/current/script.json
            work/kapak_brief.md
            upload_result.json
          retention-days: 5
          if-no-files-found: ignore
