name: render-queue
# Sıra ile değil, aynı anda: content/queue içine kaç ses dosyası atarsan
# her biri için ayrı bir makine kalkar ve kendi videosunu kurar.
#
# Kural: dosyanın adı videonun başlığıdır ve aynı zamanda kimliğidir.
# O ada karşılık gelen bir Release zaten varsa o dosya atlanır — yani
# kuyruğu temizlemeyi unutsan da aynı video ikinci kez render edilmez.
# Yeniden kurdurmak istersen: ya dosyanın adını değiştir, ya o Release'i sil.
#
# Bu workflow YouTube'a hiçbir şey yüklemez. Video Release olarak yayınlanır,
# indirmeyi ve kanala yüklemeyi sahibi elle yapar.
on:
  push:
    paths:
      - "content/queue/**"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      jobs: ${{ steps.list.outputs.jobs }}
      count: ${{ steps.list.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - name: Kuyruğu oku
        id: list
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/queue_plan.py

  video:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      # Wikimedia oyuncu fotoğraflarını çekerken aynı anda çok istek atarsak
      # 429 yiyoruz; üçer üçer gitmek hem hızlı hem güvenli.
      max-parallel: 3
      matrix:
        item: ${{ fromJson(needs.plan.outputs.jobs) }}
    name: ${{ matrix.item.title }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q Pillow numpy pydub rembg onnxruntime opencv-python-headless faster-whisper

      - name: Sesi çöz ve kurguyu ona göre kes
        env:
          AUDIO_FILE: ${{ matrix.item.path }}
          WHISPER_MODEL: ${{ vars.WHISPER_MODEL || 'small' }}
          PUNCH_EVERY: ${{ vars.PUNCH_EVERY || '4' }}
        run: |
          mkdir -p content/current
          python3 scripts/align.py

      - name: Download media libraries
        env:
          GH_TOKEN: ${{ secrets.ADMIN_PAT || github.token }}
          MEDIA_REPO: ${{ vars.MEDIA_REPO || github.repository }}
          MUSIC_REPO: ${{ vars.MUSIC_REPO || github.repository }}
        run: |
          mkdir -p work/broll work/music work/photos
          gh release download broll -R "$MEDIA_REPO" -D work/broll || echo "no b-roll release"
          gh release download music -R "$MUSIC_REPO" -D work/music || echo "no music release"
          gh release download photos -R "$MEDIA_REPO" -D work/photos || echo "no photos release"
          python3 scripts/photos.py content/current/script.json || echo "auto photos skipped"

      - name: Visuals
        run: python3 scripts/visuals.py content/current/script.json

      - name: Sound effects
        run: python3 scripts/sfx.py

      - name: Assemble
        env:
          # sessiz açılış yok: video ilk söylenen kelimeyle başlasın
          INTRO: "0"
        run: python3 scripts/assemble.py content/current/script.json

      - name: Videoyu indirmeye aç
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SIZE=$(du -h work/final.mp4 | cut -f1)

          # GitHub tek dosyada 2 GB siniri koyuyor; uzun bir kayit bunu asarsa
          # video kaybolmasin diye parcalara bolup oyle yayinliyoruz.
          SIZE_B=$(stat -c%s work/final.mp4)
          TARGET=1600000000
          NOTE=""
          FILES="work/final.mp4"
          if [ "$SIZE_B" -gt "$TARGET" ]; then
            DUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 work/final.mp4)
            PARTS=$(( SIZE_B / TARGET + 1 ))
            SEG=$(python3 -c "print(max(60,int(float('$DUR')/$PARTS)+1))")
            echo "video $SIZE -> $PARTS parca"
            ffmpeg -y -v error -i work/final.mp4 -c copy -map 0 \
                   -f segment -segment_time "$SEG" -reset_timestamps 1 \
                   "work/bolum_%02d.mp4"
            FILES=$(ls work/bolum_*.mp4 | tr '\n' ' ')
            NOTE=" Video $PARTS parca halinde, sirayla indir."
          fi

          gh release create "${{ matrix.item.tag }}" $FILES \
            -R "$GITHUB_REPOSITORY" -t "${{ matrix.item.title }}" \
            -n "Hazir video ($SIZE).$NOTE Asagidaki dosyalara tikla."
          URL="https://github.com/$GITHUB_REPOSITORY/releases/tag/${{ matrix.item.tag }}"
          echo "url=$URL" >> $GITHUB_OUTPUT
          {
            echo "## ${{ matrix.item.title }}"
            echo ""
            echo "Indirme sayfasi: $URL"
            echo ""
            echo "Boyut: $SIZE"
          } >> $GITHUB_STEP_SUMMARY

      - name: Bildirim (issue)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/brief.py content/current/script.json \
                                   content/current/meta.json > /dev/null || exit 0
          {
            echo ""
            echo "---"
            echo "**Videoyu indir:** ${{ steps.release.outputs.url }}"
          } >> work/kapak_brief.md
          gh issue create -R "$GITHUB_REPOSITORY" \
            --title "VIDEO HAZIR — ${{ matrix.item.title }}" \
            --body-file work/kapak_brief.md \
            --assignee "${{ github.repository_owner }}" \
          || gh issue create -R "$GITHUB_REPOSITORY" \
            --title "VIDEO HAZIR — ${{ matrix.item.title }}" \
            --body-file work/kapak_brief.md
